<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Chronik — News, Heroes & History</title>
<meta name="description" content="Chronik: live world news, heroes' quotes, and today in history — all in one place. No sign-up, always current." />
<meta name="theme-color" content="#FFFFFF" />

<meta property="og:type" content="website">
<meta property="og:site_name" content="Chronik">
<meta property="og:title" content="Chronik — News, Heroes & History">
<meta property="og:description" content="Live world news, heroes' quotes, and today in history — no sign-up, always current.">
<meta property="og:image" content="https://news.liyogworld.com.ng/og-cover.png">
<meta property="og:url" content="https://news.liyogworld.com.ng/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Chronik — News, Heroes & History">
<meta name="twitter:description" content="Live world news, heroes' quotes, and today in history — no sign-up, always current.">
<meta name="twitter:image" content="https://news.liyogworld.com.ng/og-cover.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/feed.css">
<link rel="stylesheet" href="css/sheet.css">
<link rel="stylesheet" href="css/ads.css">
<link rel="stylesheet" href="css/chronik.css">
</head>
<body data-theme="light">

<header class="masthead">
  <div class="masthead-top">
    <div class="brand">
      <span class="brand-mark">Chronik</span>
      <span class="brand-tag" id="screenLabel">Home</span>
    </div>
    <div class="head-controls">
      <div class="live-pulse"><span class="pulse-dot"></span><span>LIVE</span></div>
      <button class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh current screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></svg>
      </button>
    </div>
  </div>
  <!-- News-only controls (category rail + location) — hidden on Home/Chronik/You -->
  <nav class="rail" id="rail" aria-label="News categories"></nav>
  <div class="location-strip" id="locationStrip"></div>
  <!-- Chronik-only controls (quote category filter) -->
  <nav class="rail" id="chronikRail" aria-label="Chronik categories" style="display:none;"></nav>
</header>

<div class="ticker-wrap" id="tickerWrap"><div class="ticker-track" id="tickerTrack"></div></div>

<!-- ============================================================
     Three full screens, one visible at a time, toggled by
     main.js's tab router. Each is a real landmark region with
     its own aria-label, per docs/06-ACCESSIBILITY.md, so screen
     reader users can jump straight to the section they want.
============================================================= -->

<main class="wrap screen" id="screen-home" aria-label="Home — today's highlights">
  <div class="feed" id="homeFeed"></div>
</main>

<main class="wrap screen" id="screen-news" aria-label="News feed" style="display:none;">
  <div class="feed" id="feed"></div>
  <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
    <button class="load-more" id="loadMoreBtn">Show more stories</button>
  </div>
</main>

<main class="wrap screen" id="screen-chronik" aria-label="Chronik — Heroes, Quotes, and History" style="display:none;">
  <div class="feed" id="chronikFeed"></div>
</main>

<main class="wrap screen" id="screen-profile" aria-label="Living archive profile" style="display:none;">
  <div id="profileContent"></div>
</main>

<footer class="site-footer" id="siteFooter">
  <div class="footer-brand">Chronik</div>
  <p>Independent live news, heroes, and history — curated as it happens.</p>
  <p class="footer-tag">Built by Liyog Bartoos O. · Powered by LiyX Intelligence</p>
</footer>

<nav class="tabbar" aria-label="Main navigation">
  <button class="tab-btn active" data-tab="home" aria-label="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>Home
  </button>
  <button class="tab-btn" data-tab="news" aria-label="News feed">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 9v11"/></svg>News
  </button>
  <button class="tab-btn" data-tab="chronik" aria-label="Chronik — heroes, quotes, and history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>Chronik
  </button>
  <button class="tab-btn" data-tab="you" aria-label="Your settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>You
  </button>
</nav>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="sheet-handle"></div>
  <button class="sheet-close" id="sheetClose" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="sheet-scroll" id="sheetScroll"></div>
</section>

<!-- Branded "our URL first" page — shown only when the app is
     opened via a shared /go/:id link -->
<div id="goOverlay" style="display:none; position:fixed; inset:0; background:var(--bg); z-index:100; overflow-y:auto;"></div>

<div class="toast" id="toast"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
